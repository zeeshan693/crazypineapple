<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSAP Full Page Slider</title>

<link rel="stylesheet" href="style.css">

<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
overflow-x:hidden;
}

.container{
width:100%;
}

.panel{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
color:white;
}

.panel1{ background:#111; }
.panel2{ background:#2b2bff; }
.panel3{ background:#ff0066; }
.panel4{ background:#00a86b; }
</style>

</head>

<body>

<div class="container">

<section class="panel panel1">
<h1>Slide 1</h1>
</section>

<section class="panel panel2">
<h1>Slide 2</h1>
</section>

<section class="panel panel3">
<h1>Slide 3</h1>
</section>

<section class="panel panel4">
<h1>Slide 4</h1>
</section>

</div>

<script>
gsap.registerPlugin(ScrollTrigger);

const sections = gsap.utils.toArray(".panel");

gsap.to(sections, {
  yPercent: -100 * (sections.length - 1),
  ease: "none",

  scrollTrigger: {
    trigger: ".container",
    pin: true,
    scrub: 1,
    snap: {
      snapTo: 1 / (sections.length - 1),
      duration: 0.5,
      delay: 0.1,
      ease: "power1.inOut"
    },
    end: "+=4000"
  }
});
</script>

</body>
</html>
